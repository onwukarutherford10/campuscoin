[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "campuscoin-api"
version = "0.1.0"
description = "CampusCoin Flask API"
requires-python = ">=3.11"
dependencies = [
  "Flask>=3.1,<4",
  "Flask-Cors>=5,<7",
  "Flask-Migrate>=4.1,<5",
  "Flask-SQLAlchemy>=3.1,<4",
  "Flask-WTF>=1.2,<2",
  "marshmallow>=3.26,<5",
  "PyJWT>=2.10,<3",
  "PyMySQL>=1.1,<2",
  "cryptography>=44,<47",
  "python-dotenv>=1.0,<2",
  "python-dateutil>=2.9,<3",
  "structlog>=25.1,<26",
  "email-validator>=2.2,<3",
  "reportlab>=4.2,<5",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6,<8",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --cov=app --cov-report=term-missing --cov-fail-under=85"
markers = ["integration: requires a MySQL test database"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
exclude_also = ["if TYPE_CHECKING:", "pragma: no cover"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
